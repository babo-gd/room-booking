<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의실 예약</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --text: #1d2130; --muted: #6b7185;
    --line: #e2e5ee; --accent: #4f5bd5;
    --ok: #1e8e5a; --ok-bg: #e3f5ec; --bad: #c8333a; --bad-bg: #fde8e9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161d; --card: #1d2029; --text: #e8eaf2; --muted: #9aa0b4;
      --line: #2e3240; --accent: #8b94ff;
      --ok: #4cc38a; --ok-bg: #173226; --bad: #ff6b72; --bad-bg: #3a1c1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 18px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 10px; }
  label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); gap: 4px; }
  input { font: inherit; color: var(--text); background: var(--bg); width: 100%; min-width: 0;
          border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
           background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .status { font-size: .9rem; color: var(--muted); margin: 0 0 16px; }
  .result { margin-top: 12px; padding: 14px; border-radius: 10px; font-size: 1.5rem; font-weight: 700;
            text-align: center; display: none; }
  .result.ok { display: block; color: var(--ok); background: var(--ok-bg); }
  .result.bad { display: block; color: var(--bad); background: var(--bad-bg); }
  .result small { display: block; font-size: .85rem; font-weight: 400; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; margin-top: 10px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  .empty { color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>강의실 예약 시스템</h1>
  <p class="sub">이 페이지는 저장소의 <code>solution.py</code>를 브라우저에서 그대로 실행합니다. 예약 규칙은 모두 <code>solution.py</code>가 판단합니다.</p>
  <p class="status" id="status">⏳ 파이썬 불러오는 중… (처음엔 5~10초 걸려요)</p>

  <datalist id="rooms"><option value="A101"><option value="A102"><option value="B201"></datalist>
  <datalist id="days"><option value="월"><option value="화"><option value="수"><option value="목"><option value="금"></datalist>

  <section class="card">
    <h2>1. 예약하기</h2>
    <div class="grid">
      <label>강의실<input id="bRoom" list="rooms" value="A101"></label>
      <label>요일<input id="bDay" list="days" value="월"></label>
      <label>시작 (시)<input id="bStart" inputmode="decimal" placeholder="예: 10"></label>
      <label>끝 (시)<input id="bEnd" inputmode="decimal" placeholder="예: 12"></label>
      <label>이름<input id="bName" placeholder="예: 김철수"></label>
    </div>
    <button data-py disabled onclick="doBook()">예약</button>
    <div class="result" id="bookResult"></div>
  </section>

  <section class="card">
    <h2>2. 취소하기</h2>
    <div class="grid">
      <label>강의실<input id="cRoom" list="rooms" value="A101"></label>
      <label>요일<input id="cDay" list="days" value="월"></label>
      <label>시작 (시)<input id="cStart" inputmode="decimal" placeholder="예: 10"></label>
      <label>이름<input id="cName" placeholder="예약한 사람 이름"></label>
    </div>
    <button data-py disabled onclick="doCancel()">취소</button>
    <div class="result" id="cancelResult"></div>
  </section>

  <section class="card">
    <h2>3. 시간표 보기</h2>
    <div class="grid">
      <label>강의실<input id="sRoom" list="rooms" value="A101"></label>
      <label>요일<input id="sDay" list="days" value="월"></label>
    </div>
    <button data-py disabled onclick="doSchedule()">시간표 보기</button>
    <div id="schedule"></div>
  </section>

  <button data-py disabled class="ghost" onclick="doReset()">전체 초기화 (예약 모두 지우기)</button>
</main>

<script>
let py = null;

// solution.py 를 받아서 파이썬 안에 파일로 넣고 import
async function boot() {
  const status = document.getElementById("status");
  try {
    py = await loadPyodide();
    const src = await (await fetch("solution.py?v=" + Date.now())).text();
    py.FS.writeFile("/home/pyodide/solution.py", src);
    py.runPython(`
import json
from solution import RoomBooking
rb = RoomBooking()

def call(method, args_json):
    try:
        return json.dumps(getattr(rb, method)(*json.loads(args_json)), ensure_ascii=False)
    except Exception as e:
        return json.dumps(f"ERROR: {type(e).__name__}: {e}", ensure_ascii=False)
`);
    status.innerHTML = '✅ 준비 완료';
    document.querySelectorAll("[data-py]").forEach(b => b.disabled = false);
  } catch (e) {
    status.textContent = "❌ 불러오기 실패: " + e;
  }
}

function call(method, args) {
  const fn = py.globals.get("call");
  const res = JSON.parse(fn(method, JSON.stringify(args)));
  fn.destroy();
  return res;
}

const val = id => document.getElementById(id).value.trim();

// 입력한 시각을 그대로 숫자로 넘김 (10 → 정수, 10.5 → 소수). 판단은 solution.py가 함.
function num(id) {
  const s = val(id);
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : s;
}

function showResult(id, res, okText, badText, detail) {
  const el = document.getElementById(id);
  if (res === true) {
    el.className = "result ok";
    el.innerHTML = "✅ " + okText;
  } else if (res === false) {
    el.className = "result bad";
    el.innerHTML = "❌ " + badText;
  } else {
    el.className = "result bad";
    el.innerHTML = "❌ 실패";
    detail = String(res);
  }
  if (detail) {
    const s = document.createElement("small");
    s.textContent = detail;
    el.appendChild(s);
  }
}

function showSchedule(room, day) {
  document.getElementById("sRoom").value = room;
  document.getElementById("sDay").value = day;
  doSchedule();
}

function doBook() {
  const room = val("bRoom"), day = val("bDay"), start = num("bStart"), end = num("bEnd"), name = val("bName");
  const res = call("book", [room, day, start, end, name]);
  showResult("bookResult", res, "예약 성공", "예약 실패",
    `${name} · ${room} · ${day} · ${start ?? "?"}~${end ?? "?"}시`);
  showSchedule(room, day);
}

function doCancel() {
  const room = val("cRoom"), day = val("cDay"), start = num("cStart"), name = val("cName");
  const res = call("cancel", [room, day, start, name]);
  showResult("cancelResult", res, "취소 성공", "취소 실패",
    `${name} · ${room} · ${day} · ${start ?? "?"}시 시작`);
  showSchedule(room, day);
}

function doSchedule() {
  const room = val("sRoom"), day = val("sDay");
  const list = call("get_schedule", [room, day]);
  const box = document.getElementById("schedule");
  box.innerHTML = "";
  const title = document.createElement("p");
  title.className = "empty";
  title.textContent = `${room} · ${day}요일 시간표`;
  box.appendChild(title);
  if (!Array.isArray(list)) { box.append(String(list)); return; }
  if (list.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "예약이 없습니다.";
    box.appendChild(p);
    return;
  }
  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th>시간</th><th>예약자</th></tr></thead>";
  const tbody = document.createElement("tbody");
  for (const [s, e, n] of list) {
    const tr = document.createElement("tr");
    const t1 = document.createElement("td"); t1.textContent = `${s}:00 ~ ${e}:00`;
    const t2 = document.createElement("td"); t2.textContent = n;
    tr.append(t1, t2);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  box.appendChild(table);
}

function doReset() {
  if (!confirm("모든 예약을 지울까요?")) return;
  py.runPython("rb = RoomBooking()");
  ["bookResult", "cancelResult"].forEach(id => document.getElementById(id).className = "result");
  doSchedule();
}

boot();
</script>
</body>
</html>
